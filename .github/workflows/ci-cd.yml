name: Swarnandhra WasteLoop CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Production Build
        run: npm run build

      - name: Setup Python AI Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python AI Dependencies
        run: |
          cd backend_ai
          pip install -r requirements.txt

      - name: Run Docker Container Build Verification
        run: docker build -t wasteloop-platform:latest .
